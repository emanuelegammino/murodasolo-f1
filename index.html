            const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
            const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
            const l = bytes.length;
            const padLen = ((l + 9 + 63) >> 6) << 6;
            const m = new Uint8Array(padLen);
            m.set(bytes);
            m[l] = 0x80;
            const bitLen = l * 8;
            m[padLen - 4] = (bitLen >>> 24) & 255;
            m[padLen - 3] = (bitLen >>> 16) & 255;
            m[padLen - 2] = (bitLen >>> 8) & 255;
            m[padLen - 1] = bitLen & 255;
            const w = new Uint32Array(64);
            const rotr = (x, n) => (x >>> n) | (x << (32 - n));
            for (let off = 0; off < padLen; off += 64) {
                for (let i = 0; i < 16; i++) {
                    w[i] = (m[off + i * 4] << 24) | (m[off + i * 4 + 1] << 16) | (m[off + i * 4 + 2] << 8) | m[off + i * 4 + 3];
                }
                for (let i = 16; i < 64; i++) {
                    const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                    const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
                }
                let [a, b, c, d, e, f, g, h] = H;
                for (let i = 0; i < 64; i++) {
                    const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
                    const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const t2 = (S0 + maj) | 0;
                    h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
                }
                H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
                H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
            }
            return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
        }

        // ACCESSO ADMIN (Supabase Auth: email + password)
        // ==========================================
        function loadAuthSession() {
            try {
                const raw = localStorage.getItem(AUTH_SESSION_KEY);
                const sess = raw ? JSON.parse(raw) : null;
                return sess && sess.access_token && sess.refresh_token ? sess : null;
            } catch (_) { return null; }
        }
        function saveAuthSession(data) {
            const sess = {
                access_token: data.access_token,
                refresh_token: data.refresh_token,
                expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
                email: data.user?.email || ''
            };
            try { localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(sess)); } catch (_) {}
            return sess;
        }
        function clearAuthSession() {
            try { localStorage.removeItem(AUTH_SESSION_KEY); sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch (_) {}
        }
        async function authRequest(baseUrl, apiKey, grant, body) {
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=${grant}`, {
                method: 'POST',
                headers: { 'apikey': apiKey, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.access_token) {
                const err = new Error(data.error_description || data.msg || data.error || ('HTTP ' + res.status));
                err.status = res.status;
                throw err;
            }
            return data;
        }
        // Restituisce un token valido (rinnovandolo se sta per scadere) oppure null
        async function getAccessToken(baseUrl, apiKey) {
            const sess = loadAuthSession();
            if (!sess) return null;
            const now = Math.floor(Date.now() / 1000);
            if (sess.expires_at && sess.expires_at - 60 > now) return sess.access_token;
            try {
                const data = await authRequest(baseUrl, apiKey, 'refresh_token', { refresh_token: sess.refresh_token });
                return saveAuthSession(data).access_token;
            } catch (e) {
                if (e.status === 400 || e.status === 401 || e.status === 403) clearAuthSession();
                return null;
            }
        }

        function hashPin(pin) {
            return sha256Hex('murodasolo-f1::' + String(pin ?? '').trim().toUpperCase());
        }

        function isSafeUrl(url) {
            return /^https?:\/\/\S+$/i.test(String(url || '').trim());
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const ALL_KNOWN_GPS = (() => {
            const set = new Set();
            Object.values(CALENDARS_BY_YEAR).forEach(cal => cal.forEach(c => set.add(c.gp)));
            return Array.from(set).sort();

        const ALL_KNOWN_CIRCUITS = (() => {

        // Trova la gara del calendario la cui parola chiave è la più lunga contenuta nel testo
        // (evita che "spagna"/"spain" finiscano sul Belgio per via della chiave "spa").
        function matchCalendarByKeys(cal, text) {
            const lower = String(text || '').toLowerCase();
            let best = null;
            let bestLen = 0;
            (cal || []).forEach(c => (c.keys || []).forEach(k => {
                if (lower.includes(k) && k.length > bestLen) {
                    best = c;
                    bestLen = k.length;
                }
            }));
            return best;
        }

        function findCalendarMatch(year, gpOrRound) {
            const cal = CALENDARS_BY_YEAR[String(year)] || CALENDARS_BY_YEAR['2026'];
            if (typeof gpOrRound === 'number') {
                return cal.find(c => Number(c.round) === gpOrRound) || null;
            }
            const lower = String(gpOrRound || '').toLowerCase().trim();
            if (!lower) return null;
            const exact = cal.find(c => c.gp.toLowerCase() === lower);
            if (exact) return exact;
            return matchCalendarByKeys(cal, lower);
        }

        function getOrderedGpOptions(year) {
            const cal = CALENDARS_BY_YEAR[String(year)] || [];
            const seasonGps = cal.map(c => c.gp);
            const otherGps = ALL_KNOWN_GPS.filter(g => !seasonGps.includes(g));
            return { seasonGps, otherGps };
        }

        function getOrderedCircuitOptions(year) {
            const cal = CALENDARS_BY_YEAR[String(year)] || [];
            const seasonCircuits = Array.from(new Set(cal.map(c => c.circuit)));
            const otherCircuits = ALL_KNOWN_CIRCUITS.filter(c => !seasonCircuits.includes(c));
            return { seasonCircuits, otherCircuits };
        }

        function alignEpisodeWithCalendar(year, logItem) {
            if (!logItem) return logItem;
            const cal = CALENDARS_BY_YEAR[String(year)];
            let rawGp = String(logItem.gp || '').trim();
            let rawCircuit = String(logItem.circuit || '').trim();
            let roundNum = logItem.round ? Number(logItem.round) : undefined;
            const cond = (logItem.trackCondition === 'wet' || logItem.condition === 'wet') ? 'wet' : 'dry';

            const rndPrefix = rawGp.match(/^(?:round|r)\s*(\d+)\s*[—\-·:]\s*(.+)$/i);
            if (rndPrefix) {
                if (!roundNum) roundNum = Number(rndPrefix[1]);
                rawGp = rndPrefix[2].trim();
            }

            const parenMatch = rawGp.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
            if (parenMatch) {
                rawGp = parenMatch[1].trim();
                if (!rawCircuit) rawCircuit = parenMatch[2].trim();
            }

            if (cal) {
                let matched = cal.find(c => c.gp.toLowerCase() === rawGp.toLowerCase()) ||
                    matchCalendarByKeys(cal, rawGp);
                if (!matched && roundNum) {
                    matched = cal.find(c => Number(c.round) === roundNum) || null;
                }
                if (matched) {
                    const isGenericCity = !rawCircuit ||
                        rawCircuit.length < 11 ||
                        ['jeddah', 'monza', 'imola', 'baku', 'sakhir', 'monaco', 'melbourne', 'shanghai',
                         'suzuka', 'miami', 'montréal', 'montreal', 'montmelo', 'montmeló', 'spielberg',
                         'silverstone', 'spa-francorchamps', 'budapest', 'zandvoort', 'madrid', 'singapore',

                         'barcelona', 'le castellet', 'portimão', 'portimao', 'sochi', 'istanbul'].includes(rawCircuit.toLowerCase());

                    return {
                        ...logItem,
                        round: roundNum || matched.round,
                        gp: rawGp.includes('Grand Prix') ? rawGp : matched.gp,
                        circuit: isGenericCity ? matched.circuit : rawCircuit,
                        trackCondition: cond,
                        condition: cond
                    };
                }
            }

            return {
                ...logItem,
                round: roundNum,
                gp: rawGp,
                circuit: rawCircuit || undefined,
                trackCondition: cond,
                condition: cond
            };
        }

        // ==========================================
        // 5. LOGICA PUNTEGGI, SPAREGGIO F1 & NORMALIZZAZIONE
        // ==========================================
        function getSessionPoints(session, mode) {
            if (mode !== 'sixToOne') return 1;
            const s = (session || '').toLowerCase();
            if (s.includes('race') || s.includes('gara')) return 6;
            if (s === 'q1' || s === 'q2' || s === 'q3' || s.includes('qualif')) return 5;
            if (s === 'sprint' || s === 'gara sprint') return 4;
            if (s.startsWith('sq') || s.includes('sprint qual') || s.includes('shootout')) return 3;
            if (s === 'fp3' || s === 'pl3') return 2;
            return 1;
        }

        function getSessionCategory(session) {
            const s = (session || '').toLowerCase();
            if (s.includes('race') || s.includes('gara')) return 'race';
            if (s === 'q1' || s === 'q2' || s === 'q3' || s.includes('qualif')) return 'quali';
            if (s === 'sprint' || s.startsWith('sq') || s.includes('shootout')) return 'sprint';
            return 'fp';
        }

        function getTieBreakerTier(session) {
            const s = (session || '').toLowerCase();
            if (s.includes('race') || s.includes('gara')) return 0;
            if (s === 'q1' || s === 'q2' || s === 'q3' || s.includes('qualif')) return 1;
            if (s === 'sprint' || s === 'gara sprint') return 2;
            if (s.startsWith('sq') || s.includes('sprint qual') || s.includes('shootout')) return 3;
            if (s === 'fp3' || s === 'pl3') return 4;
            if (s === 'fp2' || s === 'pl2') return 5;
            return 6;
        }

        function getSessionChronologicalOrder(session) {
            const s = (session || '').toLowerCase();
            if (s === 'fp1' || s === 'pl1') return 1;
            if (s === 'fp2' || s === 'pl2') return 2;
            if (s === 'fp3' || s === 'pl3') return 3;
            if (s === 'sq1') return 4;
            if (s === 'sq2') return 5;
            if (s === 'sq3' || s.includes('shootout') || s.includes('sprint qual')) return 6;
            if (s === 'sprint' || s === 'gara sprint') return 7;
            if (s === 'q1') return 8;
            if (s === 'q2') return 9;
            if (s === 'q3' || s.includes('qualif')) return 10;
            if (s.includes('race') || s.includes('gara')) return 11;
            return 0;
        }

        // REGOLA PARI MERITO (classifiche, albo d'oro e statistiche):
        // 1) valore principale (muri nel sistema 1 a 1, punti nel 6-5-4-3-2-1)
        // 2) peso delle sessioni (punteggio 6-5-4-3-2-1)
        // 3) chi ha raggiunto per primo quel totale (il suo ultimo muro è arrivato prima)
        function logChronoKey(lg, fallbackYear) {
            const yr = Number(lg.year || fallbackYear) || 0;
            const rd = Number(lg.round) || 99;
            const si = SESSIONS_LIST.indexOf(lg.session);
            return yr * 100000 + rd * 100 + (si < 0 ? 50 : si);
        }
        function trackTie(entry, lg, fallbackYear) {
            entry.weighted = (entry.weighted || 0) + getSessionPoints(lg.session, 'sixToOne');
            entry.reachedAt = Math.max(entry.reachedAt || 0, logChronoKey(lg, fallbackYear));
        }
        function compareTie(a, b) {
            const wa = a.weighted || 0, wb = b.weighted || 0;
            if (wb !== wa) return wb - wa;
            const ra = a.reachedAt || Number.MAX_SAFE_INTEGER, rb = b.reachedAt || Number.MAX_SAFE_INTEGER;
            if (ra !== rb) return ra - rb;
            return (a.name || '').localeCompare(b.name || '');
        }
        function compareF1Entities(a, b) {
            if (b.score !== a.score) return b.score - a.score;
            return compareTie(a, b);
        }

        function syncDriversWithLogs(seasonObj) {
            const logs = Array.isArray(seasonObj.logs) ? seasonObj.logs : [];
            const drivers = Array.isArray(seasonObj.drivers)
                ? seasonObj.drivers.map(d => ({ ...d, crashes: 0 }))
                : [];
            const drvMap = {};
            drivers.forEach(d => { drvMap[d.name] = d; });

            logs.forEach(lg => {
                if (!lg || !lg.driverName) return;
                if (!drvMap[lg.driverName]) {
                    const created = {
                        id: 'd_auto_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        name: lg.driverName,
                        teamCode: lg.teamCode || 'UNK',
                        teamName: lg.teamName || TEAM_NAME_MAP[lg.teamCode] || lg.teamCode || 'Team',
                        crashes: 0
                    };
                    drivers.push(created);
                    drvMap[lg.driverName] = created;
                }
                if (countsInStandings(lg)) drvMap[lg.driverName].crashes += 1;
            });

            return { ...seasonObj, drivers, logs };
        }

        // Uniforma i nomi di sessione scritti a mano nelle versioni precedenti (P1, PL3, Gara, Sprint Q1...)
        function normalizeLogFields(lg) {
            if (!lg) return lg;
            const out = { ...lg };
            const raw = String(lg.session || '').trim();
            const low = raw.toLowerCase();
            let m;
            if ((m = low.match(/^(?:fp|pl|p)\s*([123])$/))) out.session = 'FP' + m[1];
            else if ((m = low.match(/^(?:sprint\s*shootout|sprint\s*q|sq)\s*([123])$/))) out.session = 'SQ' + m[1];
            else if ((m = low.match(/^q\s*([123])$/))) out.session = 'Q' + m[1];
            else if (low === 'gara' || low === 'g' || low === 'race') out.session = 'Race';
            else if (low === 'sprint' || low === 'gara sprint') out.session = 'Sprint';
            else if (low === 'race (formation lap)') {
                out.session = 'Race';
                if (!out.note) out.note = 'Formation Lap';
            } else if (low === 'pregara') {
                out.session = 'Race';
                if (!out.note) out.note = 'Pregara';
            }
            if (out.noDamage === true || out.noDamage === 'true') out.noDamage = true;
            else delete out.noDamage;
            const code = String(lg.teamCode || '').toUpperCase();
            if (code === 'VCA') out.teamCode = 'VCB';
            if (TEAM_NAME_MAP[out.teamCode || code]) out.teamName = TEAM_NAME_MAP[out.teamCode || code];
            return out;
        }

        function normalizeDatabase(raw) {
            if (!raw || !raw.seasons || typeof raw.seasons !== 'object') {
                return JSON.parse(JSON.stringify(DEFAULT_DB));
            }
            const cloned = JSON.parse(JSON.stringify(raw));
            Object.keys(cloned.seasons).forEach(yr => {
                const s = cloned.seasons[yr];
                if (!s.label) s.label = yr;
                if (!s.status) s.status = (yr === '2026') ? 'active' : 'completed';
                if (!Array.isArray(s.calendar) && CALENDARS_BY_YEAR[yr]) {
                    s.calendar = CALENDARS_BY_YEAR[yr].map(({ round, gp, circuit }) => ({ round, gp, circuit }));
                } else if (Array.isArray(s.calendar) && CALENDARS_BY_YEAR[yr]) {
                    s.calendar = s.calendar.map(c => {
                        if (c.circuit) return c;
                        const found = CALENDARS_BY_YEAR[yr].find(ref => Number(ref.round) === Number(c.round));
                        return found ? { round: found.round, gp: found.gp, circuit: found.circuit } : c;
                    });
                }
                if (!Array.isArray(s.drivers)) s.drivers = [];
                if (!Array.isArray(s.logs)) s.logs = [];
                s.logs = s.logs.map(lg => alignEpisodeWithCalendar(yr, normalizeLogFields(lg)));
                cloned.seasons[yr] = syncDriversWithLogs(s);
            });
            return cloned;
        }

        // Tabella riassuntiva con formule COUNTIFS che puntano al foglio Registro
        // (il valore viene anche precalcolato, così si vede subito anche nelle anteprime).
        function buildSummarySheet(XLSX, label, key, regCol, years, rows, lastRegRow) {
            const names = [...new Set(rows.filter(r => r.counts === 'Sì').map(r => r[key]).filter(Boolean))];
            const counted = rows.filter(r => r.counts === 'Sì');
            const count = (n, y) => counted.filter(r => r[key] === n && (y == null || r.year === y)).length;
            names.sort((a, b) => count(b) - count(a) || a.localeCompare(b));
            const ws = {};
            const enc = XLSX.utils.encode_cell;
            const col = XLSX.utils.encode_col;
            const totalCol = years.length + 1;
            ws[enc({ r: 0, c: 0 })] = { t: 's', v: label };
            years.forEach((y, i) => { ws[enc({ r: 0, c: i + 1 })] = { t: 'n', v: y }; });
            ws[enc({ r: 0, c: totalCol })] = { t: 's', v: 'Totale' };
            const rng = (c) => `Registro!$${c}$2:$${c}$${lastRegRow}`;
            names.forEach((n, ri) => {
                const r = ri + 1;
                ws[enc({ r, c: 0 })] = { t: 's', v: n };
                years.forEach((y, i) => {
                    const c = i + 1;
                    ws[enc({ r, c })] = {
                        t: 'n', v: count(n, y),
                        f: `COUNTIFS(${rng(regCol)},$A${r + 1},${rng('A')},${col(c)}$1,${rng('K')},"Sì")`
                    };
                });
                ws[enc({ r, c: totalCol })] = { t: 'n', v: count(n), f: `SUM(B${r + 1}:${col(totalCol - 1)}${r + 1})` };
            });
            const tr = names.length + 1;
            ws[enc({ r: tr, c: 0 })] = { t: 's', v: 'Totale' };
            for (let c = 1; c <= totalCol; c++) {
                const v = c === totalCol ? counted.length : counted.filter(x => x.year === years[c - 1]).length;
                ws[enc({ r: tr, c })] = { t: 'n', v, f: `SUM(${col(c)}2:${col(c)}${tr})` };
            }
            ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: tr, c: totalCol } });
            ws['!cols'] = [{ wch: 24 }, ...years.map(() => ({ wch: 8 })), { wch: 9 }];
            ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: names.length, c: totalCol } }) };
            return ws;
        }

        async function exportRegistroExcel() {
            const XLSX = await loadSheetJS();
            const { years, rows } = buildRegistroRows();
            const header = ['Stagione', 'Round', 'Gran Premio', 'Circuito', 'Sessione', 'Condizione', 'Pilota', 'Scuderia', 'Note', 'Link video', 'Conta in classifica'];
            const reg = XLSX.utils.aoa_to_sheet([header, ...rows.map(r =>
                [r.year, r.round, r.gp, r.circuit, r.session, r.cond, r.driver, r.team, r.note, r.url, r.counts])]);
            rows.forEach((r, i) => {
                if (r.url) reg[XLSX.utils.encode_cell({ r: i + 1, c: 9 })].l = { Target: r.url };
            });
            reg['!cols'] = [8, 7, 30, 34, 9, 11, 22, 16, 40, 34, 12].map(w => ({ wch: w }));
            reg['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: header.length - 1 } }) };
            const lastRegRow = Math.max(rows.length + 1, 2);

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, reg, 'Registro');
            XLSX.utils.book_append_sheet(wb, buildSummarySheet(XLSX, 'Pilota', 'driver', 'G', years, rows, lastRegRow), 'Piloti');
            XLSX.utils.book_append_sheet(wb, buildSummarySheet(XLSX, 'Scuderia', 'team', 'H', years, rows, lastRegRow), 'Costruttori');
            const info = XLSX.utils.aoa_to_sheet([
                ['Murodasolo F1 — Backup registro'],
                ['Esportato il', new Date().toLocaleString('it-IT')],
                ['Episodi totali', rows.length],
                ['Di cui in classifica', rows.filter(r => r.counts === 'Sì').length],
                ['Di cui senza danni (non contano)', rows.filter(r => r.counts === 'No').length],
                ['Stagioni', years.join(', ')],
                [],
                ['I fogli Piloti e Costruttori si ricalcolano dal foglio Registro (formule COUNTIFS) e contano solo le righe con "Conta in classifica" = Sì.']
            ]);
            info['!cols'] = [{ wch: 22 }, { wch: 40 }];
            XLSX.utils.book_append_sheet(wb, info, 'Info');
            const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            return { blob, filename: `murodasolo_registro_${new Date().toISOString().slice(0, 10)}.xlsx` };
        }

        // ==========================================
        // GP DISPUTATI (archivio pubblico Jolpica/Ergast) PER L'INCIDENZA MURI
        // ==========================================
        const GP_STARTS_KEY = 'murodasolo_gp_starts_v1';
        const JOLPICA_API = 'https://api.jolpi.ca/ergast/f1';
        let gpStartsCache = (() => { try { return JSON.parse(localStorage.getItem(GP_STARTS_KEY) || '{}') || {}; } catch (_) { return {}; } })();
        let gpStartsLoading = false;
        let gpStartsError = false;
        const normName = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();

        async function fetchSeasonGpStarts(year) {
            // Funzione Netlify che legge l'archivio Jolpica lato server
            const res = await fetch(`/api/gp-starts?year=${encodeURIComponent(year)}`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (!data || !data.full) throw new Error('dati non validi');
            return { full: data.full, family: data.family || {}, races: data.races || 0, fetchedAt: Date.now() };
        }

        async function ensureGpStarts() {
            if (gpStartsLoading) return;
            const nowYear = new Date().getFullYear();
            const years = getSortedSeasonKeys().filter(y => /^\d{4}$/.test(y));
            const todo = years.filter(y => {
                const c = gpStartsCache[y];
                if (!c) return true;
                // stagione in corso: aggiorna ogni 12 ore
                return Number(y) >= nowYear && Date.now() - (c.fetchedAt || 0) > 12 * 3600 * 1000;
            });
            if (!todo.length) return;
            gpStartsLoading = true;
            gpStartsError = false;
            try {
                for (const y of todo) {
                    try {
                        gpStartsCache[y] = await fetchSeasonGpStarts(y);
                        try { localStorage.setItem(GP_STARTS_KEY, JSON.stringify(gpStartsCache)); } catch (_) {}
                    } catch (_) {
                        // archivio non raggiungibile: si riprova al prossimo avvio
                        if (!gpStartsCache[y]) gpStartsError = true;
                    }
                }
            } finally {
                gpStartsLoading = false;
                render();
            }
        }

        // GP disputati da un pilota nelle stagioni indicate (null se i dati non sono disponibili)
        function getGpStarts(name, years) {
            const fn = normName(name);
            const parts = fn.split(' ');
            const fam = parts[parts.length - 1];
            let tot = 0, any = false;
            for (const y of years) {
                const c = gpStartsCache[y];
                if (!c) return null;
                any = true;
                if (c.full[fn] != null) tot += c.full[fn];
                else if (c.family[fam] != null) tot += c.family[fam];
            }
            return any ? tot : null;
        }

        function formatIncidence(muri, gp) {
            if (!gp) return '—';
            if (!muri) return `0 muri in ${gp} GP`;
            const every = gp / muri;
            return `1 ogni ${every.toFixed(every < 10 ? 1 : 0).replace('.', ',')} GP`;
        }

        // ==========================================
        // SCHEDA PILOTA & CONFRONTO TESTA A TESTA
        // ==========================================
        function getAllDriversWithCrashes() {
            const tot = {};
            getSortedSeasonKeys().forEach(yr => {
                (state.seasons[yr]?.logs || []).forEach(lg => {
                    if (!countsInStandings(lg) || !lg.driverName) return;
                    tot[lg.driverName] = (tot[lg.driverName] || 0) + 1;
                });
            });
            return Object.keys(tot).sort((a, b) => (tot[b] - tot[a]) || a.localeCompare(b));
        }

        function computeDriverProfile(name) {
            const keys = getSortedSeasonKeys().slice().sort((a, b) => Number(a) - Number(b));
            const p = {
                name, total: 0, points: 0, wet: 0, years: {}, sessions: { race: 0, quali: 0, fp: 0, sprint: 0 },
                gps: {}, teams: [], first: null, last: null, latestTeamCode: '', titles: []
            };
            keys.forEach(yr => {
                const logs = (state.seasons[yr]?.logs || [])
                    .filter(lg => countsInStandings(lg) && lg.driverName === name)
                    .sort((a, b) => (Number(a.round) - Number(b.round)) || (SESSIONS_LIST.indexOf(a.session) - SESSIONS_LIST.indexOf(b.session)));
                logs.forEach(lg => {
                    p.total += 1;
                    p.points += getSessionPoints(lg.session, 'sixToOne');
                    if (lg.trackCondition === 'wet') p.wet += 1;
                    const cat = getSessionCategory(lg.session);
                    p.sessions[cat] = (p.sessions[cat] || 0) + 1;
                    const gName = normalizeGpName(lg.gp);
                    p.gps[gName] = (p.gps[gName] || 0) + 1;
                    if (!p.years[yr]) p.years[yr] = { count: 0, teamCode: lg.teamCode };
                    p.years[yr].count += 1;
                    p.years[yr].teamCode = lg.teamCode || p.years[yr].teamCode;
                    if (lg.teamCode && !p.teams.includes(lg.teamCode)) p.teams.push(lg.teamCode);
                    const ep = { year: yr, round: lg.round, gp: gName, session: lg.session };
                    if (!p.first) p.first = ep;
                    p.last = ep;
                    p.latestTeamCode = lg.teamCode || p.latestTeamCode;
                });
            });
            p.topGps = Object.entries(p.gps).sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0])).slice(0, 3);
            const best = Object.entries(p.years).sort((a, b) => (b[1].count - a[1].count) || (Number(a[0]) - Number(b[0])))[0];
            p.bestYear = best ? { year: best[0], count: best[1].count } : null;
            p.wetPct = p.total ? Math.round((p.wet / p.total) * 100) : 0;
            p.gpStarts = getGpStarts(name, keys);
            p.rate = p.gpStarts ? p.total / p.gpStarts : null;
            // titoli dall'albo d'oro (calcolato sempre su tutto il periodo)
            const savedPeriod = state.statsPeriod;
            try {
                state.statsPeriod = 'ALL_TIME';
                const hof = computeStatsData().driverHof.find(h => h.name === name);
                p.titles = hof ? hof.titles.map(t => t.year) : [];
            } catch (_) { p.titles = []; }
            state.statsPeriod = savedPeriod;
            return p;
        }

        function renderDriverCardModal() {
            const A = computeDriverProfile(state.driverCardName);
            const B = state.driverCompareName && state.driverCompareName !== A.name ? computeDriverProfile(state.driverCompareName) : null;

        // ==========================================
        // IMMAGINE CLASSIFICA DA CONDIVIDERE (canvas 1080x1350)
        // ==========================================
        async function buildStandingsImage(kind) {
            try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (_) {}
            const data = computeStandingsData();
            const six = state.scoringMode === 'sixToOne';
            const isAll = state.activeView === 'ALL_TIME';
            const rows = (kind === 'constructors' ? data.constructorStandings : data.driverStandings)
                .map(x => kind === 'constructors'
                    ? { name: x.name, tag: '', color: x.color || getTeamColor(x.code), value: six ? x.points : x.crashes }
                    : { name: x.name, tag: x.latestTeamCode || '', color: getTeamColor(x.latestTeamCode), value: six ? x.totalPoints : x.totalCrashes })
                .filter(r => r.value > 0)
                .slice(0, 12);

            // ultimo GP con un episodio (per la stagione singola)
            let lastGpLabel = '';
            if (!isAll && state.seasons[state.activeView]) {
                const logs = state.seasons[state.activeView].logs || [];
                const last = logs.reduce((m, l) => (Number(l.round) > Number(m?.round || 0) ? l : m), null);
                if (last) lastGpLabel = `Aggiornata al R${last.round} · ${normalizeGpName(last.gp)}`;
            }

            const W = 1080, H = 1350, S = 1;
            const cv = document.createElement('canvas');
            cv.width = W * S; cv.height = H * S;
            const g = cv.getContext('2d');
            g.scale(S, S);
            const SANS = "Inter, 'Segoe UI', Roboto, Arial, sans-serif";
            const MONO = "'JetBrains Mono', ui-monospace, Consolas, monospace";
            const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
            const fit = (text, maxW) => { let t = String(text); if (g.measureText(t).width <= maxW) return t; while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; };

            // sfondo con griglia di puntini
            g.fillStyle = '#0B0E14'; g.fillRect(0, 0, W, H);
            g.fillStyle = 'rgba(255,255,255,0.05)';
            for (let y = 9; y < H; y += 24) for (let x = 9; x < W; x += 24) g.fillRect(x, y, 2, 2);
            // fascia rossa in alto
            const grad = g.createLinearGradient(0, 0, W, 0);
            grad.addColorStop(0, '#DC0000'); grad.addColorStop(1, '#7F0000');
            g.fillStyle = grad; g.fillRect(0, 0, W, 14);

            // logo dell'app (icona ufficiale), con ripiego disegnato
            const logo = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = 'icon-192.png'; });
            if (logo) {
                g.save(); rr(64, 70, 104, 104, 24); g.clip(); g.drawImage(logo, 64, 70, 104, 104); g.restore();
            } else {
                rr(64, 70, 104, 104, 24); g.fillStyle = '#DC0000'; g.fill();
                g.fillStyle = '#FFFFFF'; rr(132, 86, 14, 72, 5); g.fill();
                g.fillStyle = '#FFFFFF'; rr(84, 112, 38, 20, 6); g.fill();
            }

            g.textBaseline = 'alphabetic';
            g.fillStyle = '#FFFFFF'; g.font = `900 62px ${SANS}`;
            g.fillText('MURODASOLO', 196, 128);
            const mw = g.measureText('MURODASOLO ').width;
            g.fillStyle = '#E10600'; g.fillText('F1', 196 + mw, 128);
            g.fillStyle = '#9CA3AF'; g.font = `700 26px ${MONO}`;
            g.fillText(six ? 'Sistema di punteggio 6-5-4-3-2-1' : 'Sistema di punteggio 1 a 1', 198, 168);

            // titolo
            const title = kind === 'constructors' ? 'CLASSIFICA COSTRUTTORI' : 'CLASSIFICA PILOTI';
            const sub = isAll ? `All-Time ${getSortedSeasonKeys().slice(-1)[0] || ''}–${getSortedSeasonKeys()[0] || ''}` : `Stagione ${state.activeView}`;
            g.fillStyle = kind === 'constructors' ? '#A855F7' : '#EF4444';
            rr(64, 232, 10, 52, 5); g.fill();
            g.fillStyle = '#FFFFFF'; g.font = `900 48px ${SANS}`;
            g.fillText(title, 96, 276);
            g.fillStyle = '#FCD34D'; g.font = `800 30px ${SANS}`;
            g.fillText(sub, 96, 324);
            if (lastGpLabel) { g.fillStyle = '#9CA3AF'; g.font = `600 24px ${MONO}`; g.fillText(fit(lastGpLabel, W - 160), 96, 362); }

            // righe
            const top = 392, rowH = 66, left = 64, right = W - 64;
            const maxV = Math.max(1, ...rows.map(r => r.value));
            rows.forEach((r, i) => {
                const y = top + i * rowH;
                rr(left, y, right - left, rowH - 10, 18);
                g.fillStyle = i === 0 ? '#1B2236' : '#131823'; g.fill();
                g.strokeStyle = '#232B42'; g.lineWidth = 2; g.stroke();
                const cy = y + (rowH - 10) / 2;
                // posizione
                g.textAlign = 'center';
                const posColors = ['#FCD34D', '#D1D5DB', '#D97706'];
                g.fillStyle = posColors[i] || '#6B7280';
                g.font = `900 30px ${MONO}`;
                g.fillText(String(i + 1), left + 44, cy + 11);
                g.textAlign = 'left';
                // barra colore scuderia
                g.fillStyle = r.color; rr(left + 84, cy - 20, 8, 40, 4); g.fill();
                // nome
                g.fillStyle = '#FFFFFF'; g.font = `800 32px ${SANS}`;
                const nameMax = right - (left + 108) - 260;
                const nameTxt = fit(r.name, nameMax);
                g.fillText(nameTxt, left + 108, cy + 11);
                if (r.tag) {
                    const nx = left + 108 + g.measureText(nameTxt).width + 16;
                    g.font = `700 20px ${MONO}`;
                    const tw = g.measureText(r.tag).width + 20;
                    rr(nx, cy - 17, tw, 32, 8); g.fillStyle = '#0B0E14'; g.fill(); g.strokeStyle = '#2E3856'; g.stroke();
                    g.fillStyle = '#9CA3AF'; g.fillText(r.tag, nx + 10, cy + 7);
                }
                // barra valore
                const bx = right - 230, bw = 150;
                rr(bx, cy - 6, bw, 12, 6); g.fillStyle = '#0B0E14'; g.fill();
                rr(bx, cy - 6, Math.max(12, bw * r.value / maxV), 12, 6); g.fillStyle = r.color; g.fill();
                // valore
                g.textAlign = 'right'; g.fillStyle = '#FFFFFF'; g.font = `900 36px ${MONO}`;
                g.fillText(String(r.value), right - 24, cy + 13);
                g.textAlign = 'left';
            });
            if (!rows.length) { g.fillStyle = '#9CA3AF'; g.font = `600 30px ${SANS}`; g.fillText('Nessun episodio registrato.', 96, top + 40); }

            // piè di pagina
            g.fillStyle = '#232B42'; g.fillRect(64, H - 110, W - 128, 2);
            g.fillStyle = '#9CA3AF'; g.font = `700 26px ${MONO}`;
            g.fillText('murodasolo.netlify.app', 64, H - 60);
            g.textAlign = 'right'; g.fillStyle = '#6B7280'; g.font = `600 24px ${MONO}`;
            g.fillText(new Date().toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' }), W - 64, H - 60);
            g.textAlign = 'left';

            const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
            const slug = isAll ? 'all-time' : state.activeView;
            return { blob, filename: `murodasolo_${kind === 'constructors' ? 'costruttori' : 'piloti'}_${slug}.png` };
        }

        function closeFileReady() {
            if (pendingFile && pendingFile.url) {
                const url = pendingFile.url;
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            }
            pendingFile = null;
        }

        function canShareFile() {
            try {
                if (!pendingFile || !navigator.canShare || typeof File === 'undefined') return false;
                const f = new File([pendingFile.blob], pendingFile.filename, { type: pendingFile.blob.type });
                return navigator.canShare({ files: [f] });
            } catch (_) {
                return false;
            }
        }

        async function copyTextToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (_) {}
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, text.length);
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (_) {}
            ta.remove();
            return ok;
        }

        function openConfirm(dialog) {
            state.confirmDialog = dialog;
            state.activeModal = 'confirm';
            render();
        }

            if (state.toastTimer) clearTimeout(state.toastTimer);
            state.toast = { msg, type };
            render();
            state.toastTimer = setTimeout(() => {
                state.toast = null;
                render();

        // ==========================================
        // 7. SINCRONIZZAZIONE SUPABASE REST API
        // ==========================================
        async function pullFromCloud(manualNotify = false) {
            const baseUrl = (state.cloudCfg.url || '').trim().replace(/\/+$/, '');
            const apiKey = (state.cloudCfg.key || '').trim();
            if (!baseUrl || !apiKey) {
                state.cloudStatus = 'error';
                render();
                return;
            }

            state.cloudStatus = 'syncing';
            render();

            try {
                const res = await fetch(`${baseUrl}/rest/v1/app_state?select=*&id=in.(main,main_state,main_v1)`, {
                    method: 'GET',
                    headers: supabaseHeaders(apiKey, { 'Accept': 'application/json' })
                });

                if (!res.ok) throw new Error('HTTP ' + res.status);
                const rows = await res.json();

                if (Array.isArray(rows) && rows.length > 0) {
                    const preferred = rows.find(r => r.id === 'main') || rows.find(r => r.id === 'main_state') || rows[0];
                    state.cloudRowId = preferred.id || 'main';
                    if (preferred.data && typeof preferred.data === 'object') state.cloudColumn = 'data';
                    else if (preferred.payload && typeof preferred.payload === 'object') state.cloudColumn = 'payload';

                    const remoteState = preferred.data || preferred.payload;
                    if (remoteState && remoteState.seasons) {
                        const norm = normalizeDatabase(remoteState);
                        state.hasHydratedCloud = true;
                        state.seasons = norm.seasons;
                        try {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify({ seasons: norm.seasons }));
                        } catch (_) {}

                        state.remoteUpdatedAt = remoteState.updatedAt || null;
                        if (!IS_PUBLIC_VIEW) {
                            const remoteHash = remoteState.adminPinHash
                                || (remoteState.adminPin ? hashPin(remoteState.adminPin) : null);
                            if (remoteHash) {
                                state.cloudCfg.pinHash = remoteHash;
                                try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(state.cloudCfg)); } catch (_) {}
                            }
                        }
                        if (manualNotify) showToast('Dati aggiornati dal Cloud Supabase!', 'success');
                    }
                } else if (!state.hasHydratedCloud && !IS_PUBLIC_VIEW) {
                    state.hasHydratedCloud = true;
                    await pushToCloud(state.seasons);
                }

                state.cloudStatus = 'synced';
            } catch (_) {
                state.cloudStatus = 'error';
                if (manualNotify) showToast('Errore di connessione a Supabase.', 'error');
            }
            render();
        }

        async function fetchRemoteRow(baseUrl, apiKey) {
            const rowId = state.cloudRowId || 'main';
            const res = await fetch(`${baseUrl}/rest/v1/app_state?select=*&id=eq.${encodeURIComponent(rowId)}`, {
                headers: supabaseHeaders(apiKey, { 'Accept': 'application/json' })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const rows = await res.json();
            return Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
        }

        async function pushToCloud(nextSeasons, force = false) {
            if (IS_PUBLIC_VIEW) return false;
            const baseUrl = (state.cloudCfg.url || '').trim().replace(/\/+$/, '');
            const apiKey = (state.cloudCfg.key || '').trim();
            if (!baseUrl || !apiKey) {
                state.cloudStatus = 'error';
                render();
                return;
            }

            state.cloudStatus = 'syncing';
            render();

            try {
                const col = state.cloudColumn || 'data';

                // Protezione contro la sovrascrittura: se un altro dispositivo ha salvato
                // dopo l'ultimo download, non sovrascrivere senza conferma esplicita.
                if (!force && state.hasHydratedCloud) {
                    const remoteRow = await fetchRemoteRow(baseUrl, apiKey);
                    const remoteData = remoteRow ? (remoteRow[col] || remoteRow.data || remoteRow.payload) : null;
                    const remoteTs = remoteData?.updatedAt || null;
                    if (remoteTs && state.remoteUpdatedAt && remoteTs !== state.remoteUpdatedAt) {
                        state.cloudStatus = 'error';
                        showToast('Il cloud è stato modificato da un altro dispositivo: modifica salvata solo qui. Scarica i dati dal cloud prima di continuare.', 'error');
                        return false;
                    }
                }

                const token = await getAccessToken(baseUrl, apiKey);
                if (!token) {
                    state.isAdmin = false;
                    state.cloudStatus = 'error';
                    showToast('Sessione admin scaduta: modifica salvata solo qui. Rientra e premi "Invia" nel menu Cloud.', 'error');
                    render();
                    return false;
                }

                const nowIso = new Date().toISOString();
                const payloadBody = {
                    id: state.cloudRowId || 'main',
                    [col]: {
                        seasons: nextSeasons,
                        updatedAt: nowIso
                    }
                };

                const res = await fetch(`${baseUrl}/rest/v1/app_state?on_conflict=id`, {
                    method: 'POST',
                    headers: {
                        ...supabaseHeaders(apiKey, {
                            'Content-Type': 'application/json',
                            'Prefer': 'resolution=merge-duplicates,return=minimal'
                        }),
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payloadBody)
                });

                if (res.status === 401 || res.status === 403) {
                    showToast('Il cloud ha rifiutato il salvataggio: accesso admin non valido. Esci e rientra.', 'error');
                    throw new Error('HTTP ' + res.status);
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                state.remoteUpdatedAt = nowIso;
                state.hasHydratedCloud = true;
                state.cloudStatus = 'synced';
                render();
                return true;
            } catch (_) {
                state.cloudStatus = 'error';
            }
            render();
            return false;
        }

        function commitSeasonsUpdate(nextSeasons) {
            const normalized = normalizeDatabase({ seasons: nextSeasons }).seasons;
            state.seasons = normalized;
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ seasons: normalized }));
            } catch (_) {}
            render();
            pushToCloud(normalized);
        }

        // ==========================================
        // 8. CALCOLI CLASSIFICHE & STATISTICHE
        // ==========================================
        function computeStandingsData() {
            const sortedKeys = getSortedSeasonKeys();
            const activeLogs = [];

            if (state.activeView === 'ALL_TIME') {
                [...sortedKeys].reverse().forEach(yr => {
                    const s = state.seasons[yr];
                    (s.logs || []).forEach((lg, idx) => {
                        activeLogs.push({ ...lg, year: yr, _order: idx });
                    });
                });
            } else {
                const s = state.seasons[state.activeView];
                if (s) {
                    (s.logs || []).forEach((lg, idx) => {
                        activeLogs.push({ ...lg, year: state.activeView, _order: idx });
                    });
                }
            }

            const dMap = {};
            const ensureDriver = (name, teamCode, teamName) => {
                if (!dMap[name]) {
                    dMap[name] = {
                        name,
                        totalCrashes: 0,
                        totalPoints: 0,
                        yearBreakdown: {},
                        logs: [],
                        latestTeamCode: teamCode || 'UNK',
                        latestTeamName: teamName || TEAM_NAME_MAP[teamCode] || teamCode || 'Team'
                    };
                }
                if (teamCode) {
                    dMap[name].latestTeamCode = teamCode;
                    dMap[name].latestTeamName = teamName || TEAM_NAME_MAP[teamCode] || teamCode;
                }
                return dMap[name];
            };

            if (state.activeView === 'ALL_TIME') {
                [...sortedKeys].reverse().forEach(yr => {
                    const s = state.seasons[yr];
                    (s.drivers || []).forEach(d => ensureDriver(d.name, d.teamCode, d.teamName));
                });
                [...sortedKeys].reverse().forEach(yr => {
                    const s = state.seasons[yr];
                    (s.logs || []).forEach(lg => {
                        const entry = ensureDriver(lg.driverName, lg.teamCode, lg.teamName);
                        if (!countsInStandings(lg)) return;
                        const pts = getSessionPoints(lg.session, state.scoringMode);
                        entry.totalCrashes += 1;
                        entry.totalPoints += pts;
                        trackTie(entry, lg, yr);
                        entry.logs.push({ ...lg, year: yr, pts });

                        if (!entry.yearBreakdown[yr]) {
                            entry.yearBreakdown[yr] = {
                                year: yr,
                                teamCode: lg.teamCode,
                                teamName: lg.teamName || TEAM_NAME_MAP[lg.teamCode] || lg.teamCode,
                                crashes: 0,
                                points: 0
                            };
                        }
                        entry.yearBreakdown[yr].crashes += 1;
                        entry.yearBreakdown[yr].points += pts;
                    });
                });
            } else {
                const s = state.seasons[state.activeView];
                if (s) {
                    (s.drivers || []).forEach(d => ensureDriver(d.name, d.teamCode, d.teamName));
                    (s.logs || []).forEach(lg => {
                        const entry = ensureDriver(lg.driverName, lg.teamCode, lg.teamName);
                        if (!countsInStandings(lg)) return;
                        const pts = getSessionPoints(lg.session, state.scoringMode);
                        entry.totalCrashes += 1;
                        entry.totalPoints += pts;
                        trackTie(entry, lg, state.activeView);
                        entry.logs.push({ ...lg, year: state.activeView, pts });
                    });
                }
            }

            const driverStandings = Object.values(dMap)
                .filter(d => state.activeView === 'ALL_TIME' ? d.totalCrashes > 0 : true)
                .sort((a, b) => {
                    const valA = state.scoringMode === 'sixToOne' ? a.totalPoints : a.totalCrashes;
                    const valB = state.scoringMode === 'sixToOne' ? b.totalPoints : b.totalCrashes;
                    if (valB !== valA) return valB - valA;
                    return compareTie(a, b);
                });

            const cMap = {};
            const useLineage = state.activeView === 'ALL_TIME' && state.groupTeamLineage;
            activeLogs.forEach(lg => {
                if (!countsInStandings(lg)) return;
                const code = (lg.teamCode || 'UNK').toUpperCase();
                const rawName = lg.teamName || resolveTeamName(code);
                const name = useLineage && TEAM_LINEAGE[rawName] ? TEAM_LINEAGE[rawName] : rawName;
                const pts = getSessionPoints(lg.session, state.scoringMode);

                if (!cMap[name]) {
                    cMap[name] = {
                        code,
                        name,
                        color: getTeamColor(code),
                        crashes: 0,
                        points: 0,
                        yearBreakdown: {},
                        driverBreakdown: {},
                        logs: []
                    };
                }
                cMap[name].crashes += 1;
                cMap[name].points += pts;
                trackTie(cMap[name], lg, state.activeView);
                cMap[name].logs.push(lg);

                const dName = lg.driverName || '—';
                if (!cMap[name].driverBreakdown[dName]) {
                    cMap[name].driverBreakdown[dName] = { name: dName, crashes: 0, points: 0, years: [], codes: [] };
                }
                const dB = cMap[name].driverBreakdown[dName];
                dB.crashes += 1;
                dB.points += pts;
                const lgYear = String(lg.year || state.activeView);
                if (!dB.years.includes(lgYear)) dB.years.push(lgYear);
                if (!dB.codes.includes(code)) dB.codes.push(code);

                const yr = lg.year || state.activeView;
                if (!cMap[name].yearBreakdown[yr]) {
                    cMap[name].yearBreakdown[yr] = { year: yr, crashes: 0, points: 0 };
                }
                cMap[name].yearBreakdown[yr].crashes += 1;
                cMap[name].yearBreakdown[yr].points += pts;
            });

            if (useLineage) {
                Object.values(cMap).forEach(c => {
                    const latest = c.logs.reduce((best, lg) => (!best || Number(lg.year) > Number(best.year)) ? lg : best, null);
                    if (latest) {
                        c.code = (latest.teamCode || c.code).toUpperCase();
                        c.color = getTeamColor(c.code);
                    }
                });
            }

            const constructorStandings = Object.values(cMap).sort((a, b) => {
                const valA = state.scoringMode === 'sixToOne' ? a.points : a.crashes;
                const valB = state.scoringMode === 'sixToOne' ? b.points : b.crashes;
                if (valB !== valA) return valB - valA;
                return compareTie(a, b);
            });

            const countedLogs = activeLogs.filter(countsInStandings);
            const totalEpisodesCount = countedLogs.length;
            const totalPointsCount = countedLogs.reduce((acc, lg) => acc + getSessionPoints(lg.session, state.scoringMode), 0);
            const noDamageCount = activeLogs.length - countedLogs.length;

            return {
                activeLogs,
                noDamageCount,
                driverStandings,
                constructorStandings,
                totalEpisodesCount,
                totalPointsCount
            };
        }

        function computeStatsData() {
            const sortedKeys = getSortedSeasonKeys();
            const completedYears = sortedKeys.filter(yr => state.seasons[yr]?.status === 'completed');

            const driverHofMap = {};
            const constructorHofMap = {};
            const gpHofMap = {};

            completedYears.forEach(yr => {
                const s = state.seasons[yr];
                const logs = (s.logs || []).filter(countsInStandings);
                if (logs.length === 0) return;

                const dMap = {};
                const cMap = {};
                const gMap = {};

                logs.forEach((lg, idx) => {
                    const pts = getSessionPoints(lg.session, state.scoringMode);
                    const tier = getTieBreakerTier(lg.session);

                    const dKey = lg.driverName;
                    if (!dMap[dKey]) {
                        dMap[dKey] = { name: dKey, crashes: 0, points: 0, score: 0, tiers: [0,0,0,0,0,0,0], reachedIndex: idx };
                    }
                    dMap[dKey].crashes += 1;
                    dMap[dKey].points += pts;
                    dMap[dKey].score += pts;
                    dMap[dKey].tiers[tier] += 1;
                    dMap[dKey].reachedIndex = idx;
                    trackTie(dMap[dKey], lg, yr);

                    const cCode = (lg.teamCode || 'UNK').toUpperCase();
                    const cName = lg.teamName || TEAM_NAME_MAP[cCode] || cCode;
                    if (!cMap[cName]) {
                        cMap[cName] = { code: cCode, name: cName, crashes: 0, points: 0, score: 0, tiers: [0,0,0,0,0,0,0], reachedIndex: idx };
                    }
                    cMap[cName].crashes += 1;
                    cMap[cName].points += pts;
                    cMap[cName].score += pts;
                    cMap[cName].tiers[tier] += 1;
                    cMap[cName].reachedIndex = idx;
                    trackTie(cMap[cName], lg, yr);

                    const gName = normalizeGpName(lg.gp);
                    if (!gMap[gName]) {
                        gMap[gName] = { name: gName, crashes: 0, points: 0, score: 0, tiers: [0,0,0,0,0,0,0], reachedIndex: idx };
                    }
                    gMap[gName].crashes += 1;
                    gMap[gName].points += pts;
                    gMap[gName].score += pts;
                    gMap[gName].tiers[tier] += 1;
                    gMap[gName].reachedIndex = idx;
                    trackTie(gMap[gName], lg, yr);
                });

                const dWinner = Object.values(dMap).sort(compareF1Entities)[0];
                if (dWinner) {
                    if (!driverHofMap[dWinner.name]) driverHofMap[dWinner.name] = { name: dWinner.name, titles: [] };
                    driverHofMap[dWinner.name].titles.push({
                        year: yr,
                        value: state.scoringMode === 'sixToOne' ? `${dWinner.points} pt` : `${dWinner.crashes} muri`
                    });
                }

                const cWinner = Object.values(cMap).sort(compareF1Entities)[0];
                if (cWinner) {
                    if (!constructorHofMap[cWinner.name]) constructorHofMap[cWinner.name] = { name: cWinner.name, titles: [] };
                    constructorHofMap[cWinner.name].titles.push({
                        year: yr,
                        value: state.scoringMode === 'sixToOne' ? `${cWinner.points} pt` : `${cWinner.crashes} muri`
                    });
                }

                const gWinner = Object.values(gMap).sort(compareF1Entities)[0];
                if (gWinner) {
                    if (!gpHofMap[gWinner.name]) gpHofMap[gWinner.name] = { name: gWinner.name, titles: [] };
                    gpHofMap[gWinner.name].titles.push({
                        year: yr,
                        value: state.scoringMode === 'sixToOne' ? `${gWinner.points} pt` : `${gWinner.crashes} muri`
                    });
                }
            });

            const sortHof = (arr) => arr.sort((a, b) => {
                if (b.titles.length !== a.titles.length) return b.titles.length - a.titles.length;
                return Number(b.titles[0].year) - Number(a.titles[0].year);
            });

            const periodLogs = [];
            if (state.statsPeriod === 'ALL_TIME') {
                sortedKeys.forEach(yr => {
                    (state.seasons[yr]?.logs || []).filter(countsInStandings).forEach(lg => periodLogs.push({ ...lg, year: yr }));
                });
            } else {
                (state.seasons[state.statsPeriod]?.logs || []).filter(countsInStandings).forEach(lg => periodLogs.push({ ...lg, year: state.statsPeriod }));
            }

            const buildSessionRankings = (entityType) => {
                const buckets = { race: {}, quali: {}, fp: {}, sprint: {} };
                periodLogs.forEach(lg => {
                    const cat = getSessionCategory(lg.session);
                    let key = '';
                    let badge = '';
                    if (entityType === 'drivers') {
                        key = lg.driverName;
                        badge = lg.teamCode || '';
                    } else if (entityType === 'constructors') {
                        const cCode = (lg.teamCode || 'UNK').toUpperCase();
                        key = lg.teamName || TEAM_NAME_MAP[cCode] || cCode;
                        badge = cCode;
                    } else {
                        key = normalizeGpName(lg.gp);
                    }
                    if (!buckets[cat][key]) buckets[cat][key] = { name: key, badge, count: 0 };
                    buckets[cat][key].count += 1;
                    trackTie(buckets[cat][key], lg);
                });

                const toSorted = (obj) => Object.values(obj).sort((a, b) => {
                    if (b.count !== a.count) return b.count - a.count;
                    return compareTie(a, b);
                });

                return {
                    race: toSorted(buckets.race),
                    quali: toSorted(buckets.quali),
                    fp: toSorted(buckets.fp),
                    sprint: toSorted(buckets.sprint)
                };
            };

            const buildConditionRankings = (entityType) => {
                const dryMap = {};
                const wetMap = {};
                let totalDry = 0;
                let totalWet = 0;

                periodLogs.forEach(lg => {
                    const isWet = (lg.trackCondition === 'wet' || lg.condition === 'wet');
                    if (isWet) totalWet += 1;
                    else totalDry += 1;

                    let key = '';
                    let badge = '';
                    if (entityType === 'drivers') {
                        key = lg.driverName;
                        badge = lg.teamCode || '';
                    } else if (entityType === 'constructors') {
                        const cCode = (lg.teamCode || 'UNK').toUpperCase();
                        key = lg.teamName || TEAM_NAME_MAP[cCode] || cCode;
                        badge = cCode;
                    } else {
                        key = normalizeGpName(lg.gp);
                    }

                    const targetMap = isWet ? wetMap : dryMap;
                    if (!targetMap[key]) targetMap[key] = { name: key, badge, count: 0 };
                    targetMap[key].count += 1;
                    trackTie(targetMap[key], lg);
                });

                const toSorted = (obj) => Object.values(obj).sort((a, b) => {
                    if (b.count !== a.count) return b.count - a.count;
                    return compareTie(a, b);
                });

                return {
                    totalDry,
                    totalWet,
                    dry: toSorted(dryMap),
                    wet: toSorted(wetMap)
                };
            };

            // Anche i GP e i circuiti del calendario senza muri (0) compaiono in classifica
            const periodYears = state.statsPeriod === 'ALL_TIME' ? sortedKeys : [state.statsPeriod];
            const periodCalendar = [];
            periodYears.forEach(yr => {
                const cal = state.seasons[yr]?.calendar || CALENDARS_BY_YEAR[yr] || [];
                cal.forEach(c => periodCalendar.push(c));
            });
            const gpTotalMap = {};
            const circuitTotalMap = {};
            periodCalendar.forEach(c => {
                const gName = normalizeGpName(c.gp);
                if (c.gp && !gpTotalMap[gName]) gpTotalMap[gName] = { name: gName, crashes: 0, points: 0 };
                const cName = (c.circuit || '').trim();
                if (cName && !circuitTotalMap[cName]) circuitTotalMap[cName] = { name: cName, crashes: 0, points: 0 };
            });
            periodLogs.forEach(lg => {
                const gName = normalizeGpName(lg.gp);
                if (!gpTotalMap[gName]) gpTotalMap[gName] = { name: gName, crashes: 0, points: 0 };
                gpTotalMap[gName].crashes += 1;
                gpTotalMap[gName].points += getSessionPoints(lg.session, state.scoringMode);
                trackTie(gpTotalMap[gName], lg);
            });
            const gpOverall = Object.values(gpTotalMap).sort((a, b) => {
                const valA = state.scoringMode === 'sixToOne' ? a.points : a.crashes;
                const valB = state.scoringMode === 'sixToOne' ? b.points : b.crashes;
                if (valB !== valA) return valB - valA;
                return compareTie(a, b);
            });

            periodLogs.forEach(lg => {
                const cName = (lg.circuit || '').trim() || 'Circuito non specificato';
                if (!circuitTotalMap[cName]) circuitTotalMap[cName] = { name: cName, crashes: 0, points: 0 };
                circuitTotalMap[cName].crashes += 1;
                circuitTotalMap[cName].points += getSessionPoints(lg.session, state.scoringMode);
                trackTie(circuitTotalMap[cName], lg);
            });
            const circuitOverall = Object.values(circuitTotalMap).sort((a, b) => {
                const valA = state.scoringMode === 'sixToOne' ? a.points : a.crashes;
                const valB = state.scoringMode === 'sixToOne' ? b.points : b.crashes;
                if (valB !== valA) return valB - valA;
                return compareTie(a, b);
            });

            // RECORD PER SINGOLA EDIZIONE (GP + ANNO)
            const editionBuckets = { weekend: {}, race: {}, quali: {}, fp: {}, sprint: {} };
            periodLogs.forEach(lg => {
                const gName = normalizeGpName(lg.gp);
                const key = `${gName}|${lg.year}`;
                const add = (bucket) => {
                    if (!bucket[key]) bucket[key] = { name: `${gName} ${lg.year}`, gp: gName, year: String(lg.year), count: 0 };
                    bucket[key].count += 1;
                    trackTie(bucket[key], lg);
                };
                add(editionBuckets.weekend);
                const cat = getSessionCategory(lg.session);
                if (editionBuckets[cat]) add(editionBuckets[cat]);
            });
            const sortEditions = (obj) => Object.values(obj).sort((a, b) => {
                if (b.count !== a.count) return b.count - a.count;
                return compareTie(a, b);
            });
            const editionRankings = {
                weekend: sortEditions(editionBuckets.weekend),
                race: sortEditions(editionBuckets.race),
                quali: sortEditions(editionBuckets.quali),
                fp: sortEditions(editionBuckets.fp),
                sprint: sortEditions(editionBuckets.sprint)
            };

            return {
                editionRankings,
                driverHof: sortHof(Object.values(driverHofMap)),
                constructorHof: sortHof(Object.values(constructorHofMap)),
                gpHof: sortHof(Object.values(gpHofMap)),
                sessionRankings: {
                    drivers: buildSessionRankings('drivers'),
                    constructors: buildSessionRankings('constructors'),
                    gps: buildSessionRankings('gps')
                },
                conditionRankings: {
                    drivers: buildConditionRankings('drivers'),
                    constructors: buildConditionRankings('constructors'),
                    gps: buildConditionRankings('gps')
                },
                gpOverall,
                circuitOverall
            };
        }

        function renderVideoButton(url, small = false) {

                }

                const cond = state.editingLogForm.condition === 'wet' ? 'wet' : 'dry';
                const updatedLogs = (s.logs || []).map(item => {
                    if (item.id !== logId) return item;
                    return {
                        ...item,
                        driverName,
                        teamCode,
                        teamName: resolveTeamName(teamCode),
                        round: roundVal ? Number(roundVal) : undefined,
                        gp,
                        circuit: circuit || undefined,
                        session,
                        trackCondition: cond,
                        condition: cond,
                        note: note || undefined,
                        url: url || undefined,
                        noDamage: state.editingLogForm.noDamage ? true : undefined
                    };
                });

                state.activeModal = null;
                state.editingLogForm = null;
                commitSeasonsUpdate({
                    ...state.seasons,
                    [year]: { ...s, logs: updatedLogs }
                });
                showToast('Episodio aggiornato e classifiche ricalcolate!', 'success');
            } else if (id === 'modal-cloud-form') {
                const url = (document.getElementById('cloud-url-input')?.value || '').trim().replace(/\/+$/, '');
                const key = (document.getElementById('cloud-key-input')?.value || '').trim();
                state.cloudCfg = { url, key, pinHash: state.cloudCfg.pinHash };
                try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(state.cloudCfg)); } catch (_) {}
                state.activeModal = null;
                await pullFromCloud(true);
            }
        });

        // Avvio immediato e sincronizzazione Cloud
        render();
        pullFromCloud(false);
        setTimeout(() => { ensureGpStarts(); }, 1500);
        // App installabile e consultabile offline (solo quando servita da http/https)
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
        }
        if (state.isAdmin && !IS_PUBLIC_VIEW) {
            getAccessToken((state.cloudCfg.url || '').trim().replace(/\/+$/, ''), (state.cloudCfg.key || '').trim())
                .then(tok => { if (!tok) { state.isAdmin = false; render(); showToast('Sessione admin scaduta: accedi di nuovo.', 'info'); } });
        }
    })();
    </script>
</body>
</html>
